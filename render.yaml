services:
  - type: web
    name: sagarmanthan-sih26006
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATA_MODE
        value: DEMO
      - key: DEMO_MODE
        value: true
      - key: DATA_RANDOM_SEED
        value: 42
      - key: FREIGHT_DATA_PROVIDER
        value: synthetic
